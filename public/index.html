<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco de Imagens de Clubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: faixa superior tipo placar com a pesquisa; ficha do clube colorida com as cores do próprio clube; galerias em grelha; bancos externos em lista. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #14211b;
  --muted: #5b6b62;
  --line: #d9e0db;
  --pitch: #1f5a3c;
  --club: #1f5a3c;
  --club2: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1613; --surface: #17211c; --ink: #e6ede8; --muted: #93a49a; --line: #2a3831; --pitch: #4fae7b; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--pitch); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { background: var(--pitch); color: #fff; padding-block: 28px 30px;
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 60px, transparent 60px 120px); }
@media (prefers-color-scheme: dark) { header.top { background-color: #163f2b; } }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font: 800 clamp(30px, 5vw, 44px)/1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.brand span { opacity: .8; font-size: 14px; }
form.search { margin-top: 18px; display: flex; gap: 8px; position: relative; }
form.search input { flex: 1; min-width: 0; font: 500 18px var(--body); padding: 14px 16px; border: 0; border-radius: 6px; background: #fff; color: #14211b; }
form.search button { font: 800 18px var(--display); text-transform: uppercase; letter-spacing: .05em; padding: 0 22px; border: 0; border-radius: 6px; background: #f2c94c; color: #14211b; cursor: pointer; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
.chips button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 99px; padding: 4px 11px; cursor: pointer; font: inherit; }
.chips button:hover { background: rgba(255,255,255,.22); }

main { padding-block: 26px 60px; display: grid; gap: 28px; }
.status { color: var(--muted); }
.error { background: #fdecea; color: #8a1f17; border-radius: 6px; padding: 12px 14px; }
@media (prefers-color-scheme: dark) { .error { background: #3a1916; color: #ffb4ab; } }

.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.result { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; font: inherit; color: inherit; }
.result:hover { border-color: var(--pitch); }
.result img { width: 44px; height: 44px; object-fit: contain; flex: none; }
.result b { display: block; font: 600 20px/1.1 var(--display); }
.result small { color: var(--muted); }

.club { border-radius: 10px; overflow: hidden; background: var(--club); color: var(--club2); display: grid; grid-template-columns: auto 1fr; gap: 22px; padding: 22px; align-items: center; }
.club img { width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
.club h2 { font: 800 clamp(32px, 6vw, 56px)/.95 var(--display); text-transform: uppercase; margin: 0 0 6px; text-wrap: balance; }
.club dl { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 10px 0 0; font-size: 14px; }
.club dt { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.club dd { margin: 0; font-weight: 600; }
.club .alt { opacity: .85; }
@media (max-width: 560px) { .club { grid-template-columns: 1fr; } .club img { width: 88px; height: 88px; } }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.toolbar h3, section h3 { font: 800 24px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.btn { font: 600 13px var(--body); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--pitch); }
.count { font: 400 12px var(--mono); color: var(--muted); }

section.group { display: grid; gap: 12px; }
.group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.group-head .src { margin-left: auto; font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.tile .img { aspect-ratio: 1; display: block; position: relative; overflow: hidden; background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0/16px 16px; max-width: 100%; }
.grid.wide .tile .img { aspect-ratio: 16/9; }
.tile .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.tile.photo .img img { object-fit: cover; }
.tile .meta { padding: 8px 10px 10px; display: grid; gap: 4px; min-width: 0; }
.tile .meta b { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.tile .meta small { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.tile .url { font: 400 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .actions { display: flex; gap: 10px; font-size: 12px; font-weight: 600; }
.tile .actions a, .tile .actions button { color: var(--pitch); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
.tile .actions a:hover, .tile .actions button:hover { text-decoration: underline; }

.banks { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px 28px; }
.banks h4 { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; }
.banks ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.banks li { border-bottom: 1px solid var(--line); }
.banks a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px; text-decoration: none; }
.banks a:hover b { color: var(--pitch); text-decoration: underline; }
.banks b { font-weight: 600; }
.banks small { color: var(--muted); text-align: right; }
@media (max-width: 400px) { .banks { grid-template-columns: 1fr; } }

.note { font-size: 13px; color: var(--muted); max-width: 70ch; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .tile { transition: transform .15s; } .tile:hover { transform: translateY(-2px); } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Banco de Imagens de Clubes</h1><span>Escudos, equipamentos, estádios e fotos de qualquer clube de futebol</span></div>
    <form class="search" id="form" role="search">
      <label for="q" style="position:absolute;left:-9999px">Nome do clube</label>
      <input id="q" name="q" autocomplete="off" placeholder="Ex.: Benfica, Flamengo, Liverpool, Boca Juniors…" required minlength="2">
      <button type="submit">Procurar</button>
    </form>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="main">
  <p class="status">Escreve o nome de um clube para ver as imagens disponíveis e os links para os bancos de imagens.</p>
</main>

<div class="toast" id="toast" hidden></div>

<script>
const SUGGESTIONS = ['Benfica', 'Porto', 'Sporting CP', 'Flamengo', 'Palmeiras', 'Corinthians', 'Real Madrid', 'Barcelona', 'Manchester United', 'Boca Juniors'];
const $ = (s) => document.querySelector(s);
const main = $('#main');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let current = null;

$('#chips').innerHTML = SUGGESTIONS.map((s) => `<button type="button" data-q="${esc(s)}">${esc(s)}</button>`).join('');
$('#chips').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { $('#q').value = b.dataset.q; search(b.dataset.q); } });
$('#form').addEventListener('submit', (e) => { e.preventDefault(); search($('#q').value.trim()); });

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 1800); }
async function copy(text, msg = 'Link copiado') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg); }
}
async function getJSON(url) {
  const r = await fetch(url); const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Erro ${r.status}`); return d;
}

async function search(q) {
  if (q.length < 2) return;
  history.replaceState(null, '', `?q=${encodeURIComponent(q)}`);
  main.innerHTML = `<p class="status">A procurar “${esc(q)}”…</p>`;
  try {
    const { teams } = await getJSON(`/api/search?q=${encodeURIComponent(q)}`);
    if (teams.length === 1) return openClub({ id: teams[0].id });
    if (!teams.length) {
      main.innerHTML = `<p class="status">Não encontrei “${esc(q)}” na base de clubes. Mostro na mesma imagens livres e links de pesquisa para esse nome.</p>`;
      return openClub({ q }, true);
    }
    main.innerHTML = `<div class="toolbar"><h3>${teams.length} clubes encontrados</h3></div>
      <div class="results">${teams.map((t) => `<button class="result" data-id="${esc(t.id)}">
        ${t.badge ? `<img src="${esc(t.badge)}/tiny" alt="" loading="lazy">` : ''}
        <span><b>${esc(t.name)}</b><small>${esc([t.country, t.league].filter(Boolean).join(' · '))}</small></span></button>`).join('')}</div>`;
    main.querySelector('.results').addEventListener('click', (e) => { const b = e.target.closest('.result'); if (b) openClub({ id: b.dataset.id }); });
  } catch (err) { main.innerHTML = `<p class="error">${esc(err.message)}</p>`; }
}

async function openClub(params, keepIntro = false) {
  const intro = keepIntro ? main.innerHTML : '';
  main.innerHTML = intro + `<p class="status">A reunir imagens…</p>`;
  try {
    const data = await getJSON(`/api/club?${new URLSearchParams(params)}`);
    current = data; render(data, intro);
  } catch (err) { main.innerHTML = intro + `<p class="error">${esc(err.message)}</p>`; }
}

function render(d, intro) {
  const t = d.team;
  const allLinks = d.groups.flatMap((g) => g.items.map((i) => i.url));
  let html = intro;
  if (t) {
    const [c1 = '#1f5a3c', c2 = '#ffffff'] = t.colors;
    html += `<article class="club" style="--club:${esc(c1)};--club2:${esc(readable(c1, c2))}">
      ${t.badge ? `<img src="${esc(t.badge)}" alt="Escudo do ${esc(t.name)}">` : '<span></span>'}
      <div><h2>${esc(t.name)}</h2>${t.alternate ? `<div class="alt">${esc(t.alternate)}</div>` : ''}
      <dl>${[['País', t.country], ['Liga', t.league], ['Fundação', t.founded], ['Estádio', t.stadium], ['Cidade', t.location]]
        .filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}
      ${t.website ? `<div><dt>Site oficial</dt><dd><a href="${esc(t.website)}" target="_blank" rel="noopener">${esc(t.website.replace(/^https?:\/\//, ''))}</a></dd></div>` : ''}</dl></div>
    </article>`;
  }
  html += `<div class="toolbar"><h3>Imagens de “${esc(d.query)}”</h3>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><span class="count">${allLinks.length} imagens</span>
    ${allLinks.length ? `<button class="btn" data-copy-all>Copiar todos os links</button><button class="btn" data-export>Copiar como JSON</button>` : ''}</span></div>`;
  if (d.commonsError) html += `<p class="note">${esc(d.commonsError)}</p>`;
  for (const g of d.groups) {
    const wide = g.items.some((i) => i.wide) || g.key === 'commons';
    html += `<section class="group"><div class="group-head"><h3>${esc(g.title)}</h3><span class="count">${g.items.length}</span><span class="src">Fonte: ${esc(g.source)}</span></div>
      <div class="grid ${wide ? 'wide' : ''}">${g.items.map(tile).join('')}</div></section>`;
  }
  const byGroup = d.banks.reduce((m, b) => ((m[b.group] ||= []).push(b), m), {});
  html += `<section class="group"><div class="group-head"><h3>Bancos de imagens</h3><span class="count">${d.banks.length} links</span>
      <button class="btn" style="margin-left:auto" data-copy-banks>Copiar links</button></div>
    <div class="banks">${Object.entries(byGroup).map(([g, list]) => `<div><h4>${esc(g)}</h4><ul>${list.map((b) =>
      `<li><a href="${esc(b.url)}" target="_blank" rel="noopener"><b>${esc(b.name)}</b><small>${esc(b.note)}</small></a></li>`).join('')}</ul></div>`).join('')}</div>
    <p class="note">Escudos e marcas pertencem aos respetivos clubes. As imagens do Wikimedia Commons têm licença livre (confirma a atribuição na página de cada ficheiro); as agências de stock exigem licença para uso comercial e editorial.</p></section>`;
  main.innerHTML = html;
}

function tile(i) {
  const thumb = i.thumb || (/thesportsdb\.com/.test(i.url) ? `${i.url}/medium` : i.url);
  const sub = [i.license, i.author, i.size].filter(Boolean).join(' · ');
  const photo = /\.jpe?g$/i.test(i.url);
  return `<figure class="tile${photo ? ' photo' : ''}" style="margin:0">
    <a class="img" href="${esc(i.url)}" target="_blank" rel="noopener"><img src="${esc(thumb)}" alt="${esc(i.label)}" loading="lazy" onerror="this.src='${esc(i.url)}';this.onerror=null"></a>
    <figcaption class="meta"><b>${esc(i.label)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}
      <span class="url" title="${esc(i.url)}">${esc(i.url.replace(/^https?:\/\//, ''))}</span>
      <span class="actions"><a href="${esc(i.url)}" target="_blank" rel="noopener">Abrir</a>
      <button type="button" data-copy="${esc(i.url)}">Copiar link</button>
      ${i.page ? `<a href="${esc(i.page)}" target="_blank" rel="noopener">Licença</a>` : ''}</span></figcaption></figure>`;
}

main.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || !current) return;
  if (b.dataset.copy) copy(b.dataset.copy);
  if ('copyAll' in b.dataset) copy(current.groups.flatMap((g) => g.items.map((i) => i.url)).join('\n'), 'Links das imagens copiados');
  if ('copyBanks' in b.dataset) copy(current.banks.map((x) => `${x.name}: ${x.url}`).join('\n'), 'Links dos bancos copiados');
  if ('export' in b.dataset) copy(JSON.stringify({ clube: current.team?.name || current.query,
    imagens: current.groups.map((g) => ({ categoria: g.title, fonte: g.source, links: g.items.map((i) => ({ nome: i.label, url: i.url, licenca: i.license || undefined })) })),
    bancos: current.banks.map((x) => ({ nome: x.name, url: x.url })) }, null, 2), 'JSON copiado');
});

// Garante contraste do texto sobre a cor principal do clube.
function lum(hex) { const h = hex.replace('#', ''); const f = h.length === 3 ? [...h].map((c) => c + c).join('') : h.slice(0, 6);
  return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16) / 255).map((c) => (c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4)).reduce((a, c, i) => a + c * [.2126, .7152, .0722][i], 0); }
function readable(bg, fg) { const ratio = (a, b) => (Math.max(a, b) + .05) / (Math.min(a, b) + .05);
  try { return ratio(lum(bg), lum(fg)) >= 4.5 ? fg : lum(bg) > .4 ? '#111111' : '#ffffff'; } catch { return '#ffffff'; } }

const initial = new URLSearchParams(location.search).get('q');
if (initial) { $('#q').value = initial; search(initial); }
</script>
</body>
</html>
